name: Deploy Game to Server

on:
  push:
    branches: [ claude/magical-gauss-mvpfxb, main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure target folder exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Copy game files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "index.html,assets/**/*"
          target: "${{ secrets.DEPLOY_PATH }}"
          strip_components: 0

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            ls -la "${{ secrets.DEPLOY_PATH }}/index.html" "${{ secrets.DEPLOY_PATH }}/assets"
            echo "Deployed to ${{ secrets.DEPLOY_PATH }}"

name: Generate Game Audio (ElevenLabs)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/sfx-config.json'
      - 'scripts/generate-sfx.mjs'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sound effects via ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-sfx.mjs

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "No audio changes to commit"
          else
            git commit -m "chore: regenerate game sound effects via ElevenLabs"
            git push origin HEAD:${{ github.ref_name }}
          fi
